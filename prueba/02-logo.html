<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icono de Chatbot</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: transparent; /* Sin fondo, totalmente transparente */
            margin: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .icon-wrapper {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Animaciones para darle vida al bot */
        .floating-logo {
            animation: float 3s ease-in-out infinite;
        }

        .pulse-antenna {
            animation: pulse 2s ease-in-out infinite;
            transform-origin: 256px 60px;
        }

        .blink-eyes {
            animation: blink 5s infinite;
            transform-origin: 256px 185px; /* Centro de los ojos */
        }

        @keyframes float {
            0%, 100% { transform: translate(360px, 110px) translateY(0px); }
            50% { transform: translate(360px, 110px) translateY(-15px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.15); opacity: 1; box-shadow: 0 0 10px #fbbf24; }
        }

        @keyframes blink {
            0%, 94%, 98%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.1); }
        }
    </style>
</head>
<body>

    <div class="icon-wrapper">
        <!-- SVG Escalonable (Responsive) -->
        <svg viewBox="0 0 512 512" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
            
            <defs>
                <!-- Gradiente del cuerpo del bot -->
                <linearGradient id="botGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" />
                    <stop offset="100%" stop-color="#f1f5f9" />
                </linearGradient>

                <!-- Sombra proyectada del bot -->
                <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.15" />
                </filter>
            </defs>

            <!-- Sombra base del robot en el piso del ícono -->
            <ellipse cx="256" cy="440" rx="110" ry="15" fill="#000000" opacity="0.1" />

            <g filter="url(#dropShadow)">
                <!-- Brazo Izquierdo (descansando) -->
                <path d="M 200 320 C 140 330, 130 400, 160 410" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
                <circle cx="160" cy="410" r="16" fill="#3b82f6" /> <!-- Mano izquierda -->

                <!-- Brazo Derecho (levantando el logo) -->
                <path d="M 312 320 C 372 320, 390 280, 410 260" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" />
                
                <!-- Cuello -->
                <rect x="236" y="250" width="40" height="40" rx="8" fill="#94a3b8" />

                <!-- Cuerpo -->
                <rect x="186" y="280" width="140" height="140" rx="45" fill="url(#botGradient)" stroke="#e2e8f0" stroke-width="4" />
                <!-- Pantalla/Detalle en el estómago -->
                <rect x="216" y="310" width="80" height="70" rx="25" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
                <!-- Luces de estado en el estómago -->
                <circle cx="240" cy="345" r="5" fill="#10b981" />
                <circle cx="272" cy="345" r="5" fill="#3b82f6" />

                <!-- Orejas del bot -->
                <rect x="146" y="160" width="20" height="60" rx="10" fill="#3b82f6" />
                <rect x="346" y="160" width="20" height="60" rx="10" fill="#3b82f6" />

                <!-- Cabeza -->
                <rect x="156" y="120" width="200" height="140" rx="40" fill="url(#botGradient)" stroke="#e2e8f0" stroke-width="4" />
                
                <!-- Antena -->
                <path d="M 240 120 L 272 120 L 264 90 L 248 90 Z" fill="#94a3b8" />
                <rect x="252" y="70" width="8" height="20" fill="#cbd5e1" />
                <!-- Foco brillante de la antena -->
                <circle cx="256" cy="60" r="14" fill="#fbbf24" class="pulse-antenna" />

                <!-- Pantalla / Cara negra -->
                <rect x="176" y="140" width="160" height="90" rx="25" fill="#0f172a" />

                <!-- Rostro del bot (Ojos y mejillas) -->
                <g class="blink-eyes">
                    <circle cx="220" cy="185" r="12" fill="#38bdf8" />
                    <circle cx="292" cy="185" r="12" fill="#38bdf8" />
                    <!-- Sonrisa sutil -->
                    <path d="M 246 205 Q 256 215 266 205" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
                    <!-- Mejillas -->
                    <circle cx="200" cy="200" r="8" fill="#f472b6" opacity="0.4" />
                    <circle cx="312" cy="200" r="8" fill="#f472b6" opacity="0.4" />
                </g>

                <!-- Mano Derecha (Palma abierta sosteniendo el logo) -->
                <path d="M 390 260 A 20 20 0 0 0 430 260 Z" fill="#3b82f6" />
            </g>

            <!-- Sombra flotante debajo del logo -->
            <ellipse cx="410" cy="255" rx="20" ry="5" fill="#000000" opacity="0.15" />



            <!--=========================================
                TU LOGO ORIGINAL COMO IMAGEN
                =========================================-->
            <!-- Group posicionado sobre la mano y animado -->
            <g class="floating-logo">
                <image href="static\imagenes\logo_UTN_BOT.png" x="-10" y="-10" width="120" height="120" preserveAspectRatio="xMidYMid meet" />
            </g>
        </svg>
    </div>

</body>
</html>
